[tools]
# 言語ランタイム
node = "26.13.1"
python = "3.15.2"
ruby = "4.0.9"
go = "1.27.4"
deno = "2.9.8"
rust = "1.100.0"
bun = "1.4.4"

# CLI ツール
act = "0.2.98"
actionlint = "1.7.12"
aws-cli = "2.40.4"
bats = "1.14.0"
chezmoi = "2.74.1"
claude = "2.1.326"
cloudflared = "2026.11.0"
direnv = "2.38.2"
fd = "10.5.2"
fzf = "0.75.0"
gcloud = "593.0.0"
gh = "2.104.0"
ghq = "1.12.0"
gitleaks = "8.30.1"
jq = "1.8.2"
mas = "7.0.0"
pandoc = "3.14"
pinact = "5.0.2"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
starship = "1.27.0"
terraform = "1.17.2"
tmux = "3.8"
typst = "0.15.1"
uv = "0.13.8"
yazi = "26.9.1"
zoxide = "0.10.0"
"ubi:googleworkspace/cli" = { version = "0.22.5", exe = "gws" }
# ~/.agents/skills の ax skill も同じリリースに固定している（.chezmoidata.toml）。
"github:yusukebe/ax" = { version = "0.1.25", version_prefix = "v" }
"github:k1LoW/mo" = { version = "1.8.0", version_prefix = "v" }
# ~/.agents/skills の agent-browser skill も同じリリースに固定している（.chezmoidata.toml）。
"npm:agent-browser" = "0.43.0"

[settings]
# 既定の flavor は lib/ を含まず、新規インストールが失敗する。
python.precompiled_flavor = "install_only"
# ソースからのビルドは、baseruby の無い新規インストールで止まる。
ruby.compile = false
