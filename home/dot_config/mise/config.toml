[tools]
# Language runtimes (core backend)
node = "24.20.0"
python = "3.14.7"
ruby = "4.0.6"
go = "1.27.1"
deno = "2.9.6"
rust = "1.98.1"
# Android SDK の cmdline-tools（sdkmanager / avdmanager）は Java 製で、JDK 17 以上が必要。
# SDK ツールとの互換性を保つため、Java は LTS リリースを使用する。
java = "temurin-25.0.4+101.0.LTS"

# CLI tools (auto-selected via registry)
act = "0.2.89"
actionlint = "1.7.12"
aws-cli = "2.36.40"
bats = "1.14.0"
bun = "1.4.2"
chezmoi = "2.72.1"
claude = "2.1.261"
cloudflared = "2026.8.3"
direnv = "2.37.1"
fd = "10.5.0"
fzf = "0.74.3"
gcloud = "572.0.0"
gh = "2.100.0"
ghq = "1.10.1"
gitleaks = "8.30.1"
jq = "1.8.2"
mas = "7.0.0"
pinact = "4.1.1"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.14.0"
starship = "1.26.0"
terraform = "1.16.1"
tmux = "3.6a"
uv = "0.12.10"
yazi = "26.9.1"
zoxide = "0.10.0"

# ubi-backed CLIs (no mise/aqua registry entry)
"ubi:googleworkspace/cli" = { version = "0.22.5", exe = "gws" }

# github-backed CLIs (release assets pulled straight from GitHub, no registry entry).
# Preferred over `ubi:` for new entries: mise 2026.4 warns that the ubi backend is
# deprecated and removed in 2027.1.0, and the github backend additionally checks GitHub
# artifact attestations and SLSA provenance alongside the checksum.
#
# That extra check is best-effort, not a gate: mise treats a release with no attestations
# as `VerificationStatus::NoAttestations` ("not an error, tool may not have them") and
# falls back to the checksum alone. Making it mandatory needs a `mise.lock`, which this
# repo does not have. v0.1.25 does ship attestations -- verified at install time -- but do
# not read this entry as a guarantee that a future release will.
#
# ax is the agent-facing replacement for `curl` + a throwaway parsing script: it fetches,
# reports structure (--outline / --locate) and extracts rows/tables, with token-shaped
# output. Its companion Agent Skill is NOT installed here -- it is a chezmoi external
# pinned to the same release in [ax] (home/.chezmoidata.toml), and tests/ax.bats asserts
# the two pins carry the same version. Bump them together or that test fails.
#
# `version_prefix` strips the leading v from the upstream tag (v0.1.25 -> 0.1.25), which
# is the form mise resolves. Renovate's mise manager reads the same option to build its
# extractVersion, so dropping it would break version tracking as well as the install.
"github:yusukebe/ax" = { version = "0.1.25", version_prefix = "v" }

# npm-backed CLIs (no registry entry). agent-browser ships its specialized skills
# (electron/slack/dogfood/...) via `agent-browser skills get`, so they are loaded at
# runtime instead of being vendored; only the discovery stub is chezmoi-managed.
"npm:agent-browser" = "0.36.0"
# agent-browser の `-p ios` プロバイダが実 Mobile Safari を駆動するのに使う。xcrun simctl には
# tap/swipe/type が無く、入力には WebDriverAgent が要る（`appium driver install xcuitest` が
# その WDA のビルドと導入を肩代わりする）。`npm i -g` ではなく mise 管理にするのは、mise の
# node を上げたときに global npm の中身が消えるのを避けるため。
"npm:appium" = "3.7.0"

pandoc = "3.11"
typst = "0.15.1"

[settings]
# Pin precompiled CPython to a flavor that ships lib/; latest mise otherwise
# selects freethreaded+install_only_stripped, which omits lib/ and fails with
# "Python installation is missing a `lib` directory" on fresh installs (see #121, #104).
python.precompiled_flavor = "install_only"
# Use precompiled ruby; a source build deadlocks on fresh installs without a
# baseruby on PATH, because ruby-build's configure probe re-enters the mise
# shim for the in-progress version and blocks on the install lock (see #122).
ruby.compile = false
