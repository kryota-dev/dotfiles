[phone_harness]
  # phone-harness — https://github.com/ShawnPana/phone-harness
  # Lets an agent drive a real phone from this Mac: an iPhone through the iPhone
  # Mirroring window, or an Android over adb. macOS-only (the CLI depends on
  # pyobjc), so everything it needs is gated on .chezmoi.os == "darwin".
  #
  # TWO pins, deliberately, because the two artifacts come from different
  # datasources and are fetched by different layers:
  #   version — the PyPI release installed by run_onchange_after_19-setup-phone-harness.sh.tmpl
  #             via `uv tool install`. Tracked by a pypi custom manager.
  #   commit  — the upstream commit that .chezmoiexternal.toml reads SKILL.md from.
  #             Tracked by a git-refs custom manager, pinned to a full SHA so a
  #             moved default branch cannot make `chezmoi apply` drift.
  # They can legitimately sit at different points in upstream history: SKILL.md is
  # standalone markdown, so a lagging skill pin never breaks the installed CLI.
  # Neither is ever auto-merged — this ships executable code that captures the
  # screen and synthesises input on a real device (see renovate.json5 packageRules).
  version = "0.2.0"
  commit = "47f37a6dd5baae9f10f16e21e50a6898ee42cd22"

[eli5]
  # eli5 skill — https://github.com/anthropics/claude-plugins-community/tree/main/eli5
  # A single-file markdown skill with no dependent code, same shape as phone-harness's
  # SKILL.md above: upstream already ships valid discovery frontmatter (name +
  # description), so it is fetched verbatim as a file external rather than wrapped in a
  # curated skill of our own. Unlike phone-harness there is no companion CLI/PyPI
  # package to pin, so a single `commit` pin (full SHA) is enough here.
  # Source path is eli5/skills/eli5/SKILL.md — the skill lives under a skills/<name>/
  # subdir inside the eli5/ plugin directory of claude-plugins-community, not at the
  # repo root (unlike phone-harness, which is a single-skill repo).
  # Tracked by a git-refs custom manager in renovate.json5; never auto-merged (see
  # packageRules) — same rationale as drawio/supabase: a compromised upstream must not
  # ride the pin-automerge lane into prompt-injected skill content.
  commit = "a727be1c7bd6064419b6f60d71993a19198adc17"

[ntfy]
  # Self-hosted ntfy notification server (kryota-dev/dotfiles#337).
  # SSOT for every ntfy constant except the Docker image tag, which lives
  # literally in home/dot_config/ntfy/compose.yaml.tmpl so Renovate's regex
  # manager can track it (drift is caught by tests/files.bats).
  port = 2586
  # Server-side history retention (cache-duration). User-approved trade-off:
  # 7 days of reviewable history vs. plaintext SQLite residency on disk.
  cache_duration = "168h"
  # Fixed urgency-based topics; attribution (repo/branch/account/session/event)
  # travels in tags and titles, never in topic names. The ad-hoc smoke-test
  # topic (claude-test) is a runbook-only convention in
  # docs/architecture/notifications.md, not rendered config, so it is
  # intentionally not declared here.
  topic_attention = "claude-attention"
  topic_done = "claude-done"
  # Weekday morning-brief delivery (kryota-dev/dotfiles#361). Distinct from the
  # agent-completed stream so the daily brief can be muted/subscribed on its own;
  # the notification's click opens the brief page served on the tailnet.
  topic_brief = "claude-brief"
  # Loopback port for the brief static-file sidecar (#361), fronted on the
  # tailnet by `tailscale serve --https=8443` (a port proxy — macOS cannot serve
  # files/directories directly). Distinct from the ntfy port above.
  brief_port = 2587

[ntfy_dashboard]
  # Notification-history dashboard (kryota-dev/dotfiles#371): a native Deno
  # server reading claude-attention/claude-done via the ntfy polling API, with
  # on-demand LLM summaries. Both ports below are SSOT'd here — unlike the
  # [ntfy] brief_port/8443 split above, where 8443 is a literal in
  # ntfy/lib.sh.tmpl outside this file; this feature does not repeat that.
  port = 2588
  # Tailnet HTTPS port-proxy front (`tailscale serve --https`), tailnet-only —
  # never funnel. A dedicated port keeps it independent of the ntfy root (443)
  # and the brief-page front (8443).
  serve_https = 8444
  # On-demand summary rate limiting: TTL cache key is a hash of the fetched
  # notification window, plus a rolling daily cap, so a re-tapped "summarize"
  # button cannot re-trigger a fresh billed `claude -p` call each time.
  summary_ttl_seconds = 300
  summary_daily_cap = 20
  # Bounds a single headless `claude -p` summary call (mirrors
  # morning-radar.sh's TIMEOUT_SECONDS/MAX_TURNS watchdog).
  claude_timeout_seconds = 60
  claude_max_turns = 5

[macos_defaults_drift]
  # Keys excluded from the weekly drift check (kryota-dev/dotfiles#365),
  # "domain:key" formatted. Read by executable_macos-defaults-drift-check.sh.
  # Only keys managed by run_onchange_after_20-macos-defaults.sh.tmpl are ever
  # compared in the first place, and #364 already curated that list down to
  # stable, intentional settings — so nothing there is expected to be noisy
  # yet. This list exists as a safety valve for a future managed key that
  # turns out to fluctuate on its own (window position, cache, timestamp, or
  # other machine-specific value), not because a current key needs it.
  #
  # One "domain:key" string per line (matches the multi-line-array parsing
  # convention _ecc_skill_list() in tests/helpers/setup.bash already
  # established for [ecc].skills — keep this in that same shape so both the
  # bash reader and any future bats helper can use the same awk pattern).
  exclude_keys = [
  ]
