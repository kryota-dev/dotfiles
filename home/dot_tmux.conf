# プレフィックスキーをctrl+aに変更
set -g prefix C-a

# デフォルトのプレフィックスキーctrl+bを解除
unbind C-b

# プレフィックスキー+^でペインを垂直分割する
bind ^ split-window -h

# プレフィックスキー+-でペインを水平分割する
bind - split-window -v

# 256色モードを有効化
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの文字色、背景色を変更
setw -g status-style fg=colour255,bg=colour234

# マウス操作を有効化
set-option -g mouse on

# Shift+Enterで`Escape "[13;2u"`を送信（Claude Code, Codex, Copilot CLIなどの環境下で、Shift+Enterによる改行を可能にするための設定）
bind -n S-Enter send-keys Escape "[13;2u"

# ウィンドウ番号・ペイン番号を 1 起点にする（0 起点だとキーボードの並びと 1 つずれる）
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰め直す（欠番を残さない）
set -g renumber-windows on

# ペイン境界にタイトルを表示する（既定の pane-border-format が pane_title を含むため、
# select-pane -T で付けたタイトルがそのまま見える）
set -g pane-border-status top

# 再起動の後に、セッション・ウィンドウ・ペインの並びと作業ディレクトリを戻す（tmux-resurrect と
# tmux-continuum。chezmoi の externals で取得する）。continuum はサーバーの起動の直後に最後の保存を復元する。
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'
# 再起動の直前に始めた会話を取りこぼす幅を小さくする（変化が無ければ保存ファイルは増えない）。
set -g @continuum-save-interval '5'
# 既定のプロセスの復元は、保存したコマンドラインをそのままシェルに打ち込み、ファイル名などに含まれる
# $(...) まで実行しうるので止める。Claude Code だけを下の hook で戻す。
set -g @resurrect-processes 'false'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/claude-resume.sh save'
set -g @resurrect-hook-pre-restore-all '~/.config/tmux/claude-resume.sh mark'
set -g @resurrect-hook-pre-restore-pane-processes '~/.config/tmux/claude-resume.sh restore'
run-shell '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'
# continuum.tmux は先頭で set -x を実行するので、出力を捨てる。
run-shell '~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux >/dev/null 2>&1'
# continuum の自動保存はステータス行の描画で動き、クライアントが居ないと止まるので、切断のときにも保存する。
set-hook -g client-detached 'run-shell -b "~/.local/share/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'
