# プレフィックスキーをctrl+aに変更
set -g prefix C-a

# デフォルトのプレフィックスキーctrl+bを解除
unbind C-b

# プレフィックスキー+^でペインを垂直分割する
bind ^ split-window -h

# プレフィックスキー+-でペインを水平分割する
bind - split-window -v

# 256色モードを有効化
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの文字色、背景色を変更
setw -g status-style fg=colour255,bg=colour234

# マウス操作を有効化
set-option -g mouse on

# Shift+Enterで`Escape "[13;2u"`を送信（Claude Code, Codex, Copilot CLIなどの環境下で、Shift+Enterによる改行を可能にするための設定）
bind -n S-Enter send-keys Escape "[13;2u"

# ウィンドウ番号・ペイン番号を 1 起点にする（0 起点だとキーボードの並びと 1 つずれる）
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰め直す（欠番を残さない）
set -g renumber-windows on

# ペイン境界にタイトルを表示する（既定の pane-border-format が pane_title を含むため、
# select-pane -T で付けたタイトルがそのまま見える）
set -g pane-border-status top
