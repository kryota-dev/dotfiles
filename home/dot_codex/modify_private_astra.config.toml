{{- /* chezmoi:modify-template */ -}}
{{- /* Codex 自身もこのファイルに書き込む（モデルの案内の表示回数など）ので、管理するのは以下のキーだけ。 */ -}}
{{- /* `codex --profile astra`: 最も難しい作業を通しでやらせるとき。OpenAI が GPT-6.2 ではクライアントの effort から始めるよう勧めるため、effort は固定せず config.toml の値を引き継ぐ。 */ -}}
{{- /* T3 Code（codex app-server）からはプロファイルを選べない。 */ -}}
{{- $c := fromToml .chezmoi.stdin -}}
{{- $c = setValueAtPath "model" "gpt-6.2-astra" $c -}}
{{- $c = deleteValueAtPath "model_reasoning_effort" $c -}}
{{- toToml $c -}}
