{{- /* chezmoi:modify-template */ -}}
{{- /* Codex 自身もこのファイルに書き込む（プロジェクトの trust・plugin）ので、管理するのは以下のキーだけ。 */ -}}
{{- $c := fromToml .chezmoi.stdin -}}
{{- $c = setValueAtPath "personality" "pragmatic" $c -}}
{{- /* 既定は OpenAI が Codex の複雑な作業に勧める GPT-6.1 Sol を既定のエフォートで使い、計画だけ深く考えさせる。最も難しい作業は --profile astra で切り替える。 */ -}}
{{- $c = setValueAtPath "model" "gpt-6.1-sol" $c -}}
{{- $c = setValueAtPath "model_reasoning_effort" "medium" $c -}}
{{- $c = setValueAtPath "plan_mode_reasoning_effort" "high" $c -}}
{{- /* コンテキストウィンドウはモデルごとに自動で決まる。固定値はモデルを切り替えるとずれるので、以前に書いたものも消す。 */ -}}
{{- $c = deleteValueAtPath "model_context_window" $c -}}
{{- $c = setValueAtPath "developer_instructions" "ユーザーの判断が必要なときは、選択肢と各選択肢の含意を番号付きで示してから止まる。報告の末尾に平文の問いを書いて待たない。" $c -}}
{{- $c = setValueAtPath "features.memories" true $c -}}
{{- $c = setValueAtPath "mcp_servers.context7" (dict "command" "npx" "args" (list "-y" "@upstash/context7-mcp")) $c -}}
{{- $c = setValueAtPath "mcp_servers.deepwiki" (dict "url" "https://mcp.deepwiki.com/mcp") $c -}}
{{- $c = setValueAtPath "mcp_servers.exa" (dict "command" "npx" "args" (list "-y" "exa-mcp-server@3.2.1") "env_vars" (list "EXA_API_KEY")) $c -}}
{{- $c = setValueAtPath "mcp_servers.firecrawl" (dict "command" "npx" "args" (list "-y" "firecrawl-mcp@3.22.0") "env_vars" (list "FIRECRAWL_API_KEY")) $c -}}
{{- /* spark は Spark Desktop の IPC ソケットにつなぐので、sandbox の中のシェルからは届かない。sandbox の外で起動する MCP で使い、read-only と注釈されていない書き込み系のツールだけ承認を求める。 */ -}}
{{- /* 読み取りは承認なしで通り、firecrawl などの読み取り専用ツールも任意の URL に送れるので、メールが文脈にあると承認なしで外へ出しうる。既定では無効にし、使うときだけ `codex -c mcp_servers.spark.enabled=true` で有効にする。 */ -}}
{{- $c = setValueAtPath "mcp_servers.spark" (dict "command" "spark" "args" (list "mcp") "default_tools_approval_mode" "writes" "enabled" false) $c -}}
{{- toToml $c -}}
