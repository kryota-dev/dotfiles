name: CI

on:
  push:
    branches: [main]
    paths:
      - 'home/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'home/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The mise pins are the only place these two versions are declared, and this job used
      # to ignore both: it installed no shellcheck at all and silently linted with whatever
      # build the runner image shipped, while shfmt's version was repeated here as a
      # literal. `make lint` locally runs the pinned builds, so the two could disagree --
      # the pinned shellcheck deliberately stopped reporting SC2015 on `A && B || C`, which
      # the image's older build still reports -- and a change could only fail after a push
      # (#475). Reading the pins keeps the "declare it, never inherit it from the image"
      # intent of the apt steps while making a local `make lint` a faithful proxy for this
      # job. Version numbers stay out of this file on purpose; tests/files.bats guards that.
      - name: Resolve the pinned lint tool versions
        id: lint-tools
        run: |
          shellcheck_version=$(sed -n 's/^shellcheck = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          shfmt_version=$(sed -n 's/^shfmt = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$shellcheck_version" ] || { echo "shellcheck pin not found in mise config" >&2; exit 1; }
          [ -n "$shfmt_version" ] || { echo "shfmt pin not found in mise config" >&2; exit 1; }
          echo "shellcheck=$shellcheck_version" >>"$GITHUB_OUTPUT"
          echo "shfmt=$shfmt_version" >>"$GITHUB_OUTPUT"

      - name: Install shellcheck
        env:
          VERSION: ${{ steps.lint-tools.outputs.shellcheck }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v${VERSION}/shellcheck" /usr/local/bin/shellcheck
          # Fail here rather than lint the whole tree with an unexpected build.
          shellcheck --version | grep -qxF "version: ${VERSION}"

      - name: Install shfmt
        env:
          VERSION: ${{ steps.lint-tools.outputs.shfmt }}
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${VERSION}/shfmt_v${VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          shfmt --version | grep -qxF "v${VERSION}"

      # unzip is only needed to unpack the pinned Deno release below. The runner image
      # ships it, but declaring it keeps this job from depending on the image's contents.
      - name: Install zsh and unzip
        run: sudo apt-get install -y zsh unzip

      # Single source of truth: the same `make lint` developers run locally
      # (shellcheck + shfmt + zsh syntax for .zsh, .zsh.tmpl, and _ghq).
      - name: Run lint
        run: make lint

      # The mise pin is the only place the Node version is declared; reading it
      # here keeps CI from becoming a second source of truth that Renovate misses.
      - name: Resolve the pinned Node.js version
        id: node-version
        run: |
          version=$(sed -n 's/^node = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "node pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # `make test` runs lint-node before test-node; the split CI jobs keep the
      # syntax check with the other linters.
      - name: Run Node harness lint
        run: make lint-node

      # Same read-the-pin discipline as shellcheck, shfmt and Node above. Deno is used here
      # only as the linter behind `make lint-console`; the ntfy dashboard's own deno targets
      # stay opt-in and are still not run in CI.
      - name: Resolve the pinned Deno version
        id: deno-version
        run: |
          version=$(sed -n 's/^deno = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "deno pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install Deno
        env:
          VERSION: ${{ steps.deno-version.outputs.version }}
        run: |
          curl -fsSL "https://github.com/denoland/deno/releases/download/v${VERSION}/deno-x86_64-unknown-linux-gnu.zip" -o "$RUNNER_TEMP/deno.zip"
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/deno" /usr/local/bin/deno
          # Fail here rather than run the console guard with an unexpected build.
          deno --version | head -n1 | grep -q "^deno ${VERSION} "

      # The machine guard that replaced the stop:check-console-log hook retired in #520
      # (#522). Locally it is part of `make test`; here it sits with the other linters.
      - name: Run console guard
        run: make lint-console

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        # jq is needed by the wave-orchestrator hook and its bats suite. The runner
        # image happens to ship it, but declaring it here keeps the suite from
        # silently depending on the image's contents. shellcheck is deliberately not
        # in this list: the apt build is unpinned, and the step below installs the
        # same pinned build the Lint job uses. unzip unpacks the pinned Deno release.
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh jq unzip

      # tests/shellcheck.bats runs shellcheck unconditionally and tests/brew_launcher.bats
      # runs it when present, both with the exact flags `make lint` uses. Without the pin
      # this job would check the same files as the Lint job with a different shellcheck.
      - name: Resolve the pinned shellcheck version
        id: shellcheck-version
        run: |
          version=$(sed -n 's/^shellcheck = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "shellcheck pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install shellcheck
        env:
          VERSION: ${{ steps.shellcheck-version.outputs.version }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v${VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -qxF "version: ${VERSION}"

      # tests/files.bats renders the chezmoi script templates and executes them, which is the only
      # way to assert the brew-bundle failure policy as behaviour rather than as text — a purely
      # textual assertion cannot catch a preflight that is present but does not actually work.
      # Those tests skip when chezmoi is absent, so without this step they would silently never run
      # here. Installed standalone (the same installer install/install.sh uses) rather than via
      # mise, which would pull the entire pinned toolchain for one binary.
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Resolve the pinned Node.js version
        id: node-version
        run: |
          version=$(sed -n 's/^node = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "node pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # Without this step the frontier-harness suite would only ever run locally.
      - name: Run Node harness tests
        run: make test-node

      # tests/console_lint.bats drives `make lint-console` directly (a textual assertion
      # cannot tell a working guard from one that has quietly stopped detecting anything),
      # so this job needs deno as well -- the same reason shellcheck is installed twice.
      - name: Resolve the pinned Deno version
        id: deno-version
        run: |
          version=$(sed -n 's/^deno = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "deno pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install Deno
        env:
          VERSION: ${{ steps.deno-version.outputs.version }}
        run: |
          curl -fsSL "https://github.com/denoland/deno/releases/download/v${VERSION}/deno-x86_64-unknown-linux-gnu.zip" -o "$RUNNER_TEMP/deno.zip"
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/deno" /usr/local/bin/deno
          deno --version | head -n1 | grep -q "^deno ${VERSION} "

      - name: Run Bats tests
        run: make test-bats

  sync-ghq-completion:
    name: Sync ghq completion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same-repo PRs only: fork PRs would receive a read-only GITHUB_TOKEN
    # (so the push step would fail anyway), but skipping them up front avoids
    # executing fork-side Makefile code in CI.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # persist-credentials must stay false (ghalint policy 013); the
          # push step below uses an ephemeral token URL instead.
          persist-credentials: false

      - name: Install zsh (required by the sync target's syntax check)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run sync-ghq-completion
        run: make sync-ghq-completion

      - name: Commit & push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet home/dot_config/zsh/completions/_ghq; then
            echo "No change to _ghq; skipping commit."
            exit 0
          fi
          version=$(scripts/ghq-version.sh)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home/dot_config/zsh/completions/_ghq
          git commit -m "chore: sync _ghq completion for ghq v${version}"
          # Push with an ephemeral token URL — credentials are never written
          # back to .git/config (ghalint policy 013).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
