name: CI

on:
  push:
    branches: [main]
    paths:
      - 'home/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'home/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt
        run: |
          SHFMT_VERSION=3.13.1
          curl -sS -L "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Install zsh
        run: sudo apt-get install -y zsh

      # Single source of truth: the same `make lint` developers run locally
      # (shellcheck + shfmt + zsh syntax for .zsh, .zsh.tmpl, and _ghq).
      - name: Run lint
        run: make lint

      # The mise pin is the only place the Node version is declared; reading it
      # here keeps CI from becoming a second source of truth that Renovate misses.
      - name: Resolve the pinned Node.js version
        id: node-version
        run: |
          version=$(sed -n 's/^node = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "node pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # `make test` runs lint-node before test-node; the split CI jobs keep the
      # syntax check with the other linters.
      - name: Run Node harness lint
        run: make lint-node

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        # jq is needed by the wave-orchestrator hook and its bats suite. The runner
        # image happens to ship it, but declaring it here keeps the suite from
        # silently depending on the image's contents.
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck zsh jq

      # tests/files.bats renders the chezmoi script templates and executes them, which is the only
      # way to assert the brew-bundle failure policy as behaviour rather than as text — a purely
      # textual assertion cannot catch a preflight that is present but does not actually work.
      # Those tests skip when chezmoi is absent, so without this step they would silently never run
      # here. Installed standalone (the same installer install/install.sh uses) rather than via
      # mise, which would pull the entire pinned toolchain for one binary.
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Resolve the pinned Node.js version
        id: node-version
        run: |
          version=$(sed -n 's/^node = "\(.*\)"$/\1/p' home/dot_config/mise/config.toml)
          [ -n "$version" ] || { echo "node pin not found in mise config" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # Without this step the frontier-harness suite would only ever run locally.
      - name: Run Node harness tests
        run: make test-node

      - name: Run Bats tests
        run: make test-bats

  sync-ghq-completion:
    name: Sync ghq completion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same-repo PRs only: fork PRs would receive a read-only GITHUB_TOKEN
    # (so the push step would fail anyway), but skipping them up front avoids
    # executing fork-side Makefile code in CI.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # persist-credentials must stay false (ghalint policy 013); the
          # push step below uses an ephemeral token URL instead.
          persist-credentials: false

      - name: Install zsh (required by the sync target's syntax check)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run sync-ghq-completion
        run: make sync-ghq-completion

      - name: Commit & push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet home/dot_config/zsh/completions/_ghq; then
            echo "No change to _ghq; skipping commit."
            exit 0
          fi
          version=$(scripts/ghq-version.sh)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home/dot_config/zsh/completions/_ghq
          git commit -m "chore: sync _ghq completion for ghq v${version}"
          # Push with an ephemeral token URL — credentials are never written
          # back to .git/config (ghalint policy 013).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
